apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: z-mq-nameserver
  namespace: z-mq
  labels:
    app: z-mq-nameserver
spec:
  serviceName: z-mq-nameserver
  replicas: 1
  selector:
    matchLabels:
      app: z-mq-nameserver
  template:
    metadata:
      labels:
        app: z-mq-nameserver
    spec:
      # ⚠ 与 hostPath 成对钉节点（2026-11-11 持久化规范）：数据在节点本地盘 ⇒ 漂移即丢。
      nodeSelector:
        kubernetes.io/hostname: zifang002
      containers:
        - name: nameserver
          image: z-mq-nameserver:local
          imagePullPolicy: Never
          ports:
            - name: rpc
              containerPort: 9876
          env:
            - name: ZMQ_NAMESRV_PORT
              value: "9876"
            - name: ZMQ_NAMESRV_KV_CONFIG
              value: /data/namesrv/kvConfig.json
            # ⚠ bind host 显式声明 0.0.0.0：Service/NodePort 选的是 Pod IP，
            # 不是容器内的 127.0.0.1 ⇒ 容器形态必须监听通配地址。
            # 代码侧默认是回环（协议层无认证，绑通配=开放给整个局域网），靠这里显式打开。
            - name: ZMQ_SERVER_HOST
              value: "0.0.0.0"
          volumeMounts:
            - name: data
              mountPath: /data/namesrv
          readinessProbe:
            tcpSocket:
              port: 9876
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 9876
            initialDelaySeconds: 30
            periodSeconds: 20
      volumes:
        # kvConfig 真源 = zifang002:/home/zifang/data/z-mq/nameserver（2026-11-11 自 volumeClaimTemplates 迁入）
        - name: data
          hostPath:
            path: /home/zifang/data/z-mq/nameserver
            type: Directory
