apiVersion: v1
kind: Service
metadata:
  name: z-mq-nameserver
  namespace: z-mq
spec:
  clusterIP: None
  selector:
    app: z-mq-nameserver
  ports:
    - name: rpc
      port: 9876
      targetPort: 9876
---
apiVersion: v1
kind: Service
metadata:
  name: z-mq-broker
  namespace: z-mq
spec:
  clusterIP: None
  selector:
    app: z-mq-broker
  ports:
    - name: rpc
      port: 10911
      targetPort: 10911
---
# ClusterIP: None（headless）只服务集群内 Pod 发现；客户端要能从集群外连进来，
# 得再挂 NodePort 或 LoadBalancer，这里显式分开，不把两种用途混在一个 Service 上。
apiVersion: v1
kind: Service
metadata:
  name: z-mq-nameserver-nodeport
  namespace: z-mq
spec:
  type: NodePort
  selector:
    app: z-mq-nameserver
  ports:
    - name: rpc
      port: 9876
      targetPort: 9876
      nodePort: 31976
---
apiVersion: v1
kind: Service
metadata:
  name: z-mq-broker-nodeport
  namespace: z-mq
spec:
  type: NodePort
  selector:
    app: z-mq-broker
  ports:
    - name: rpc
      port: 10911
      targetPort: 10911
      nodePort: 31911
---
apiVersion: v1
kind: Service
metadata:
  name: z-mq-broker-admin-nodeport
  namespace: z-mq
spec:
  type: NodePort
  selector:
    app: z-mq-broker-admin
  ports:
    - name: http
      port: 9090
      targetPort: 9090
      nodePort: 31990
